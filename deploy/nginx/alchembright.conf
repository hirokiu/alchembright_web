# Load this file from nginx.conf's http {} context (e.g. /etc/nginx/conf.d/).
# Replace the existing www.alchembright.com virtual host; do not enable both.
include /data/www/130_note.ab/static/current/nginx/wp-id-maps.conf;

server {
    server_name www.alchembright.com;
    root /data/www/130_note.ab/static/current/public;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;
    add_header X-Frame-Options SAMEORIGIN always;
    expires -1;

    access_log /data/log/nginx/130_note.ab/access.log main;
    error_log /data/log/nginx/130_note.ab/error.log;

    # Query redirects are intentionally limited to the legacy front controllers.
    # Only imported, published IDs are mapped. Ambiguous/unknown IDs return 404.
    location = / {
        if ($ab_legacy_target != "") { return 301 https://www.alchembright.com$ab_legacy_target; }
        if ($ab_has_legacy_query) { return 404; }
        if ($arg_s != "") { return 404; }
        if ($arg_feed != "") { return 404; }
        try_files /index.html =404;
    }
    location = /index.php {
        if ($ab_legacy_target != "") { return 301 https://www.alchembright.com$ab_legacy_target; }
        if ($ab_has_legacy_query) { return 404; }
        if ($args != "") { return 404; }
        return 301 https://www.alchembright.com/;
    }
    location = /feed { return 301 https://www.alchembright.com/feed.xml; }
    location = /feed/ { return 301 https://www.alchembright.com/feed.xml; }
    location = /feed.xml {
        types { }
        default_type application/rss+xml;
        try_files $uri =404;
    }

    # No PHP execution and no repository/hidden files are served.
    location ~* \.php(?:/|$) { return 404; }
    location ~ (^|/)\. { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(?:css|js|ico|png|jpe?g|gif|webp|avif|svg|woff2?)$ {
        try_files $uri =404;
        expires 24h;
    }

    listen 443 ssl; # existing Certbot certificate
    ssl_certificate /etc/letsencrypt/live/www.alchembright.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.alchembright.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    server_name www.alchembright.com;
    listen 80;
    if ($host = www.alchembright.com) {
        return 301 https://www.alchembright.com$request_uri;
    }
    return 404;
}
