name: Validate migration preview
on:
  pull_request:
  push:
    branches: [main, docs/wordpress-migration-audit]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: migration-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 scripts/deploy/audit-vps-paths.test.py
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run migration:verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alchembright-migration-preview
          path: dist/
          retention-days: 7
