<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc"><title id="title">超音波センサー配列による人流データ収集の概念図</title><desc id="desc">複数の超音波センサーの測定値をRaspberry Piで取得し、時刻と測定点の配列データとして収集する。実際のセンサー数や設置構成を示すものではない。</desc><rect width="840" height="360" fill="#f3f7f4"/><g font-family="sans-serif" fill="#173d2c"><text x="28" y="46" font-size="24">超音波センサー配列 → 人流データ</text><text x="30" y="98" font-size="18">複数の測定点</text><g fill="white" stroke="#246b4b" stroke-width="2"><rect x="30" y="122" width="160" height="32" rx="8"/><rect x="30" y="172" width="160" height="32" rx="8"/><rect x="30" y="222" width="160" height="32" rx="8"/><path d="M190 138h42v50h60m-102 0h102m-102 50h42v-50" fill="none"/><rect x="296" y="132" width="218" height="112" rx="14"/><path d="M526 188h50m-10-8 10 8-10 8" fill="none"/></g><g font-size="16" text-anchor="middle"><text x="110" y="144">超音波センサー</text><text x="110" y="194">超音波センサー</text><text x="110" y="244">超音波センサー</text><text x="405" y="179" font-size="23">Raspberry Pi</text><text x="405" y="213">測定値の取得・収集</text></g><text x="595" y="100" font-size="17">時刻 × 測定点</text><g stroke="#aac8b7" fill="white"><rect x="602" y="129" width="192" height="120"/><path d="M650 129v120m48-120v120m48-120v120M602 159h192m-192 30h192m-192 30h192"/></g><g fill="#246b4b"><rect x="651" y="160" width="46" height="28" opacity=".3"/><rect x="699" y="190" width="46" height="28" opacity=".65"/><rect x="747" y="220" width="46" height="28" opacity=".4"/></g><text x="28" y="317" font-size="14" fill="#666">概念図：測定点の数・配置・配列の値は説明用です</text></g></svg>
